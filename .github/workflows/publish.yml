name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Check setup
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then echo "Missing EXPO_TOKEN secret (see README)"; exit 1; fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm install

      - run: npx tsc --noEmit

      - name: Publish
        run: eas update --branch main --message "${{ github.event.head_commit.message || 'manual publish' }}" --platform ios --non-interactive
